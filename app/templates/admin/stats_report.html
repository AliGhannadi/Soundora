{% extends 'admin/base_site.html' %}

{% block content %}

<style>

.dashboard {
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 15px;
    margin-bottom: 40px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card h2 {
    margin: 0;
    font-size: 32px;
}

.card p {
    color: #666;
}

.chart-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.bar-row {
    margin-bottom: 18px;
}

.bar-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
}

.bar-bg {
    width: 100%;
    height: 20px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    border-radius: 10px;
}

</style>

<div class="dashboard">

    <h1>OS Statistics Dashboard</h1>

    <!-- Cards -->
    <div class="cards">

        {% for item in stats_data %}

        <div class="card">
            <h2>{{ item.value }}</h2>
            <p>{{ item.name }}</p>
        </div>

        {% endfor %}

    </div>

    <!-- Pure CSS Bar Chart -->
    <div class="chart-box">

        <h2>Usage Distribution</h2>

        {% for item in stats_data %}

        <div class="bar-row">

            <div class="bar-info">
                <strong>{{ item.name }}</strong>
                <span>
                    {{ item.percent|floatformat:1 }}%
                </span>
            </div>

            <div class="bar-bg">
                <div
                    class="bar-fill"
                    style="
                        width: {{ item.percent }}%;
                        background: {{ item.color }};
                    ">
                </div>
            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
